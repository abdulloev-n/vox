<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }
  .pill {
    box-sizing: border-box; height: 48px; padding: 0 20px; border-radius: 24px;
    display: flex; align-items: center; gap: 12px; color: #f4f4f2;
    background: rgba(25, 25, 25, 0.96); border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff8b80; flex: none; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.8); } }
  canvas { width: 140px; height: 28px; flex: none; }
  .time { font-size: 13px; font-variant-numeric: tabular-nums; color: #c4c3c0; min-width: 32px; text-align: right; }
  .tag { font-size: 12px; color: #c4c3c0; border: 1px solid rgba(255,255,255,.22); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .msg { font-size: 14px; font-weight: 500; white-space: nowrap; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #6aaef2; animation: bounce 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }
  .ok { color: #5ccb92; } .err { color: #ff8b80; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .dot, .dots i { animation: none; } }
</style>
</head>
<body>
<div class="pill">
  <div id="rec" style="display:contents">
    <div class="dot"></div>
    <canvas id="wave"></canvas>
    <div class="time" id="time">0:00</div>
    <div class="tag" id="tag" hidden>No cleanup</div>
  </div>
  <div id="busy" style="display:contents" hidden>
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="msg" id="busyMsg">Processing</div>
  </div>
  <div id="result" style="display:contents" hidden>
    <div class="msg" id="resultMsg"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const canvas = $('wave'), ctx = canvas.getContext('2d');
const DPR = window.devicePixelRatio || 1;
canvas.width = 140 * DPR; canvas.height = 28 * DPR;

const POINTS = 48;
let levels = new Array(POINTS).fill(0);
let stream, recorder, chunks = [], audioCtx, analyser, buf, raf, startAt = 0, peak = 0;
let cancelled = false, stopRequested = false;

function show(which) {
  $('rec').hidden = which !== 'rec';
  $('busy').hidden = which !== 'busy';
  $('result').hidden = which !== 'result';
}

function draw() {
  analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / buf.length);
  peak = Math.max(peak, rms);
  const prev = levels[levels.length - 1];
  levels.push(prev * 0.5 + Math.min(1, rms * 7) * 0.5);
  levels.shift();

  const w = canvas.width, h = canvas.height, c = h / 2;
  ctx.clearRect(0, 0, w, h);
  const step = w / (POINTS - 1);
  const amp = (i) => {
    const edge = Math.min(1, Math.min(i, POINTS - 1 - i) / 6);
    return Math.max(0.8 * DPR, levels[i] * (h / 2 - 1) * edge);
  };
  ctx.beginPath();
  for (let i = 0; i < POINTS; i++) ctx.lineTo(i * step, c - amp(i));
  for (let i = POINTS - 1; i >= 0; i--) ctx.lineTo(i * step, c + amp(i));
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, '#6aaef2'); g.addColorStop(1, '#5ccb92');
  ctx.fillStyle = g;
  ctx.fill();

  const sec = Math.floor((Date.now() - startAt) / 1000);
  $('time').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  raf = requestAnimationFrame(draw);
}

function release() {
  cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (audioCtx) audioCtx.close().catch(() => {});
  stream = null; audioCtx = null; recorder = null;
}

async function start(opts) {
  cancelled = false; stopRequested = false; chunks = []; peak = 0; levels.fill(0);
  startAt = Date.now();
  $('tag').hidden = opts.cleanup !== false;
  show('rec');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { deviceId: opts.deviceId ? { exact: opts.deviceId } : undefined, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    window.vox.send('rec:error', 'No microphone access');
    return;
  }
  if (cancelled) { release(); return; }
  audioCtx = new AudioContext();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  buf = new Float32Array(analyser.fftSize);
  src.connect(analyser);
  const rec = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
  recorder = rec;
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    const durationMs = Date.now() - startAt;
    const wasCancelled = cancelled;
    release();
    if (wasCancelled) return;
    const data = await new Blob(chunks, { type: 'audio/webm' }).arrayBuffer();
    window.vox.send('rec:data', { buffer: data, durationMs, peak });
  };
  rec.start();
  draw();
  if (stopRequested) rec.stop();
}

window.vox.on('rec:start', (o) => start(o || {}));
window.vox.on('rec:stop', () => {
  show('busy');
  stopRequested = true;
  if (recorder && recorder.state === 'recording') recorder.stop();
});
window.vox.on('rec:cancel', () => {
  cancelled = true;
  if (recorder && recorder.state !== 'inactive') recorder.stop(); else release();
});
window.vox.on('widget:state', ({ state, message }) => {
  if (state === 'done' || state === 'error') {
    show('result');
    const m = $('resultMsg');
    m.textContent = (state === 'done' ? '✓ ' : '') + (message || '');
    m.className = 'msg ' + (state === 'done' ? 'ok' : 'err');
  }
});
show('rec');
</script>
</body>
</html>
